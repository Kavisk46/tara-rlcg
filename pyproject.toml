[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tara"
version = "0.1.0"
description = "Task-Aware Adaptive Retrieval Architecture: repository-level code generation guided by explicit software-engineering task understanding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TARA Contributors" }]
keywords = ["code-generation", "retrieval-augmented-generation", "software-engineering", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "networkx>=3.3",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10",
    "gitpython>=3.1",
    "transformers>=4.42",
    "filelock>=3.13",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/kavimugilsk/tara-rlcg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
